    <script>
        const dropdownButtons = document.querySelectorAll(".side-btn");

        dropdownButtons.forEach(function (button) {
            const dropdown = button.closest(".side-dropdown");

            button.addEventListener("click", function () {
                const isOpening = !dropdown.classList.contains("open");

                document.querySelectorAll(".side-dropdown").forEach(function (item) {
                    item.classList.remove("open");

                    const itemButton = item.querySelector(".side-btn");

                    if (itemButton) {
                        itemButton.setAttribute("aria-expanded", "false");
                    }
                });

                if (isOpening) {
                    dropdown.classList.add("open");
                    button.setAttribute("aria-expanded", "true");
                }
            });
        });
    </script>
